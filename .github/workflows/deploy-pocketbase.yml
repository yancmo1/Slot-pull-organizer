name: Deploy PocketBase

on:
  push:
    branches:
      - main
    paths:
      - 'infra/pocketbase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy PocketBase to Oracle VM
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          HOST: ${{ secrets.ORACLE_VM_HOST }}
          REMOTE_USER: ${{ secrets.ORACLE_VM_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              "$REMOTE_USER@$HOST" bash << 'ENDSSH'
          set -e
          mkdir -p /opt/infra-new/apps/pocketbase
          cat > /opt/infra-new/apps/pocketbase/docker-compose.yml << 'COMPOSEFILE'
          services:
            pocketbase:
              image: ghcr.io/muchobien/pocketbase:latest
              container_name: slotpull-pocketbase
              restart: unless-stopped
              ports:
                - "127.0.0.1:8090:8090"
              volumes:
                - pb_data:/pb/pb_data
              healthcheck:
                test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
                interval: 30s
                timeout: 10s
                retries: 3

          volumes:
            pb_data:
              driver: local
          COMPOSEFILE
          cd /opt/infra-new/apps/pocketbase
          docker compose pull
          docker compose up -d
          echo "--- Health check ---"
          sleep 5
          curl -sf http://localhost:8090/api/health && echo " PocketBase healthy" || echo " Health check failed"
          ENDSSH
          rm -f /tmp/deploy_key
