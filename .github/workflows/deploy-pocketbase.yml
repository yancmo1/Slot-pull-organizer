name: Deploy PocketBase

on:
  push:
    branches:
      - main
    paths:
      - 'infra/pocketbase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          source: "infra/pocketbase/docker-compose.yml"
          target: "/opt/infra-new/apps/pocketbase/"
          strip_components: 2

      - name: Start / update PocketBase
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd /opt/infra-new/apps/pocketbase
            docker compose pull
            docker compose up -d
            echo "--- Health check ---"
            sleep 3
            curl -sf http://localhost:8090/api/health && echo " PocketBase healthy" || echo " Health check failed"
